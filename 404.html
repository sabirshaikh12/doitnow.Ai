<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page not found – DOITNOW</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080D1A;color:#fff;font:16px/1.6 system-ui,sans-serif;text-align:center;padding:24px}a{display:inline-block;margin-top:16px;padding:12px 22px;border-radius:12px;background:linear-gradient(135deg,#00F5D4,#00CFFF);color:#031a22;font-weight:700;text-decoration:none}p{color:#A9B7CD}</style></head>
<body><div><h1>Page not found</h1><p>That page doesn’t exist or has moved.</p><a id="h" href="/">Go to homepage</a></div>
<script>var s=location.pathname.split("/")[1],g=/\.github\.io$/.test(location.hostname);if(g&&s&&location.hostname.split(".")[0]!==s)document.getElementById("h").href="/"+s+"/";</script></body></html>
